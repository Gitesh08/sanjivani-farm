name: Sync Google Reviews

on:
  schedule:
    # Runs every 4 hours (6 times a day)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Puppeteer for Headless Scraper
        run: npm install --no-save puppeteer

      - name: Run Reviews Sync
        run: node scripts/scrape-reviews.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/data/reviews.json src/assets/data/reviews-summary.json
          if git diff --staged --quiet; then
            echo "No new review changes detected. Retaining current fallback data."
          else
            git commit -m "chore(reviews): auto-sync Google reviews and ratings [skip ci]"
            git push
          fi
