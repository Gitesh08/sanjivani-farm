<section class="events-split section bg-surface-lowest" id="events" aria-labelledby="events-title">
  <div class="container">
    <div class="events-split__grid">
      
      <!-- Visual Anchor (Left Side) -->
      <div class="events-split__visual">
        <div class="events-split__image-wrap">
          <img [src]="heroImage" alt="Memorable Gatherings at Sanjivani" class="events-split__img" loading="lazy">
        </div>
      </div>

      <!-- Typography & Features (Right Side) -->
      <div class="events-split__content">
        
        <!-- Header -->
        <div class="events-split__header">
          <span class="section-tag events-split__label">Host Your Perfect Day</span>
          <h2 class="display-lg events-split__title font-heading" id="events-title">
            Memorable Gatherings in Nature
          </h2>
          <p class="body-xl events-split__subtitle text-muted">
            The perfect natural canvas for your most important milestones.
          </p>
        </div>

        <!-- Event Types List -->
        <ul class="events-list" role="list">
          @for (event of eventTypes; track event.title) {
            <li class="events-list__item">
              <div class="events-list__text">
                <h3 class="events-list__title">{{ event.title }}</h3>
                <p class="events-list__desc text-muted">{{ event.desc }}</p>
              </div>
            </li>
          }
        </ul>

        <!-- CTA -->
        <div class="events-split__cta">
          <a href="tel:+919172200481" class="btn btn-primary btn-lg" id="home-enquiry-events">
            Enquire About Your Event
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </a>
        </div>

      </div>
    </div>
  </div>
</section>
