<section class="hero" aria-label="Hero">

  <!-- BACKGROUND MEDIA (Crossfade Netflix Style) -->
  <div class="hero__video-wrapper" aria-hidden="true">
    <!-- Instant Poster Image -->
    <img
      src="https://res.cloudinary.com/dsepjvm2l/video/upload/f_auto,q_auto:best,w_1920,so_0/v1785523935/DJI_0018_-_Trim_lrd183.jpg"
      alt="" class="hero__poster" [class.hero__poster--hidden]="videoReady()" fetchpriority="high" loading="eager">

    <!-- Video (Native streaming, bound directly to prevent Chromium cached MP4 sync freeze) -->
    <video #heroVideo class="hero__video" [class.hero__video--ready]="videoReady()" (playing)="onVideoReady()"
      (canplay)="onVideoReady()" (loadeddata)="onVideoReady()" [src]="videoUrl()" loop muted playsinline
      preload="metadata">
    </video>
  </div>

  <!-- VIGNETTE LAYERS -->
  <div class="hero__vignette hero__vignette--top" aria-hidden="true"></div>
  <div class="hero__vignette hero__vignette--bottom" aria-hidden="true"></div>

  <!-- CONTENT -->
  <div class="hero__content container">
    <div class="hero__text-wrap">
      <!-- <span class="hero__badge label-md">
        <span class="hero__badge-dot" aria-hidden="true"></span>
        Palghar · Konkan · Maharashtra
      </span> -->

      <h1 class="hero__title font-heading">
        <span class="hero__title-brand">Sanjivani</span>
        <span class="hero__title-sub">
          Where <em class="hero__title-em">Nature Gives You</em> Life Again
        </span>
      </h1>


      <div class="hero__actions" role="group" aria-label="Primary actions">
        <a routerLink="/stay" class="btn btn-primary btn-lg" id="hero-book-stay">
          Book Your Stay
        </a>
        <a routerLink="/our-story" class="btn btn-ghost btn-lg" id="hero-explore-farm">
          Get E-Brochure
        </a>
      </div>
    </div>


  </div>

  <!-- SCROLL HINT -->
  <div class="hero__scroll-hint" aria-hidden="true">
    <span class="hero__scroll-line"></span>
    <span class="hero__scroll-label label-md">Scroll</span>
  </div>

</section>
