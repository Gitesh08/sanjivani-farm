<section class="hero" aria-label="Hero">

  <!-- BACKGROUND MEDIA (Crossfade Netflix Style) -->
  <div class="hero__video-wrapper" aria-hidden="true">
    <!-- Instant Poster Image -->
    <img
      [src]="heroPoster()"
      alt="" class="hero__poster" [class.hero__poster--hidden]="videoReady()" fetchpriority="high" loading="eager">

    <!-- Video -->
    <app-video-player #heroVideo 
      customClass="hero__video" 
      [class.hero__video--ready]="videoReady()" 
      (playing)="onVideoReady()"
      (canplay)="onVideoReady()" 
      [hlsUrl]="heroHls()"
      [loop]="true" 
      [muted]="true" 
      [playsinline]="true"
      [autoplay]="true"
      [preferHighQuality]="true"
      [isHero]="true"
      [hideSpinner]="true"
      preload="auto">
    </app-video-player>
  </div>

  <!-- VIGNETTE LAYERS -->
  <div class="hero__vignette hero__vignette--top" aria-hidden="true"></div>
  <div class="hero__vignette hero__vignette--bottom" aria-hidden="true"></div>

  <!-- CONTENT -->
  <div class="hero__content container">
    <div class="hero__text-wrap">
      <h1 class="hero__title font-heading">
        <div class="hero__title-lockup">
          <span class="hero__title-brand">Sanjivani</span>
          <span class="hero__title-suffix">Farm And Resort</span>
        </div>
        <span class="hero__title-sub">
          Where <em class="hero__title-em">Nature Gives You</em> Life Again
        </span>
      </h1>

      <div class="hero__actions" role="group" aria-label="Primary actions">
        <a href="#cottages" (click)="scrollTo('cottages', $event)" class="btn btn-primary btn-lg" id="hero-book-stay">
          Book Your Stay
        </a>
        <a href="https://drive.google.com/uc?export=download&id=1D6oPqq-dtfPBesZUEQhC58Ott9kIDaTh" target="_blank"
          class="btn btn-ghost btn-lg" id="hero-explore-farm">
          Explore Our Brochure
        </a>
      </div>
    </div>
  </div>

  <!-- SCROLL HINT -->
  <div class="hero__scroll-hint" aria-hidden="true">
    <span class="hero__scroll-line"></span>
    <span class="hero__scroll-label label-md">Scroll</span>
  </div>

</section>

<!-- FLOATING 360 TOUR BUTTON (Desktop Initial Position) -->
<button (click)="openTour()" class="btn-floating-tour" aria-label="Open 360 Aerial Tour">
  <span class="material-symbols-outlined tour-btn__icon" aria-hidden="true">360</span>
</button>
